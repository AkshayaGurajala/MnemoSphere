<!DOCTYPE html>
<html>
<head>
    <title>Add URL - MnemoSphere</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar">
    <h2>MnemoSphere</h2>
    <div>
        <a href="/">Home</a>
        <a href="/memories">Memories</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/knowledge-graph">Knowledge Graph</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container mobile-save-container">
    <h1>Save Webpage URL</h1>
    <p>Paste any learning webpage link and MnemoSphere will save it with AI summary.</p>

    {% if message %}
        <div class="auth-error">{{ message }}</div>
    {% endif %}

    <form method="POST" class="mobile-save-form">
        <label>Webpage URL</label>
        <input type="url" name="url" placeholder="https://example.com/tutorial" required>

        <label>Topic</label>
        <input type="text" name="topic" placeholder="Example: Python, AI, Cloud" value="General Knowledge">

        <label>Notes</label>
        <textarea name="notes" placeholder="Why do you want to save this?"></textarea>

        <label>Difficulty</label>
        <select name="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <button type="submit">Save Memory</button>
    </form>
</div>

</body>
</html>
