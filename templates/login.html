<!DOCTYPE html>
<html>
<head>
    <title>Login - MnemoSphere</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Login to access your AI memory system.
        </p>

        <form method="POST">

            <input 
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <div class="password-wrapper">

                <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

                <span 
                    class="toggle-password"
                    onclick="togglePassword()"
                >
                    👁
                </span>

            </div>

            {% if error %}
                <p class="error-message">
                    {{ error }}
                </p>
            {% endif %}

            <button type="submit">
                Login with Password
            </button>

        </form>

        <a href="/login-otp" class="auth-link">
            Login with OTP
        </a>

        <a href="/forgot-password" class="auth-link">
            Forgot Password?
        </a>

        <p>
            New user?
            <a href="/signup">
                Register / Signup
            </a>
        </p>

    </div>

</div>

<script>

function togglePassword() {

    const passwordInput = document.getElementById("password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}

</script>

</body>
</html>
